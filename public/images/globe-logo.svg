  <circle cx="425" cy="70" r="4" fill="#ffffff"/>
  <path d="M 425 70 L 405 50 M 425 70 L 445 50 M 425 70 L 425 95" stroke="#ffffff" stroke-width="3"/>
  <!-- Village houses -->
  <rect x="280" y="140" width="30" height="25" fill="#fef3c7"/>
