  <!-- Globe -->
  <circle cx="250" cy="340" r="100" fill="#15803d"/>
  <path d="M 180 320 Q 210 280 250 300 Q 290 280 320 330 C 300 380 260 420 210 410 Q 170 380 180 320 Z" fill="#22c55e"/>
  <path d="M 210 300 Q 240 260 270 280 Q 290 310 260 340 Z" fill="#86efac"/>
  <path d="M 170 340 C 190 380 220 420 260 435 C 200 430 160 390 170 340 Z" fill="#ffffff" opacity="0.3"/>
