<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#09090b"/>
  <!-- Green trees silhouettes -->
  <path d="M 50 160 Q 80 100 110 160 Q 140 100 170 160 C 180 130 220 130 230 160 C 250 120 290 120 310 160 C 330 110 380 110 400 160 C 420 120 460 130 470 180 L 30 180 Z" fill="#22c55e" opacity="0.9"/>
  <path d="M 120 140 Q 150 90 180 140 Q 210 80 240 140 C 260 110 290 110 310 140 C 330 90 370 90 390 140 L 100 140 Z" fill="#15803d" opacity="0.8"/>
  <!-- Windmill -->
